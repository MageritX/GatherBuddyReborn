name: Publish
on:
  push:
    tags:
      - '*.*.*.*'
jobs:
  Build:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      REPO_NAME: ${{ github.repository }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get Environment Variables
        run: |
          $tag = "${{ github.ref }}" -replace 'refs/tags/', ''

          "tag=$tag" | Out-File -Append -FilePath $Env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 10.0.x
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Dalamud (global + CN dev assemblies)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

          # The CN fork's GatherBuddy.GameData / GatherBuddy.DataImport / GatherBuddy.Levenshtein
          # projects use Dalamud.CN.NET.Sdk, which resolves the Dalamud installation from
          # %APPDATA%\XIVLauncherCN\addon\Hooks\dev. The official goatcorp Dalamud does NOT contain
          # ClientLanguage.ChineseSimplified, so the CN dev assemblies are required as well.
          # Pinned snapshot (source: XIVLauncherCN's Dalamud dev folder):
          # https://github.com/MageritX/GatherBuddyReborn/releases/tag/cn-dalamud-dev-15-0-3-4
          Invoke-WebRequest -Uri https://github.com/MageritX/GatherBuddyReborn/releases/download/cn-dalamud-dev-15-0-3-4/cn-dalamud-dev.zip -OutFile cn-dalamud.zip
          Expand-Archive -Force cn-dalamud.zip "$env:AppData\XIVLauncherCN\addon\Hooks\dev"

      - name: Restore Nuget Packages
        run: dotnet restore Gatherbuddy/Gatherbuddy.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release Gatherbuddy/Gatherbuddy.csproj -p:AssemblyVersion=${{ env.tag }} -p:FileVersion=${{ env.tag }} -p:PackageVersion=${{ env.tag }} -p:InformationalVersion=${{ env.tag }} --output .\build
      - name: Build raphael-cli from raphael-rs
        run: |
          git clone https://github.com/KonaeAkira/raphael-rs.git raphael-rs-temp
          cd raphael-rs-temp
          cargo build --release --package raphael-cli
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: Failed to build raphael-cli"
            exit 1
          }
          Copy-Item -Path ".\target\release\raphael-cli.exe" -Destination "..\build\raphael-cli.exe" -Force
          cd ..
          Remove-Item -Recurse -Force raphael-rs-temp
          Write-Host "Successfully built and copied raphael-cli.exe"

      - name: Zip Plugin
        run: Compress-Archive -Path .\build\* -DestinationPath .\build\GatherbuddyReborn.zip

      - name: Publish Plugin
        uses: softprops/action-gh-release@v3
        with:
          files: ./build/GatherbuddyReborn.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update pluginmaster.json
        shell: pwsh
        run: |
          $ts  = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $ver = "${{ env.tag }}"
          $dl  = "https://github.com/MageritX/GatherBuddyReborn/releases/download/$ver/GatherbuddyReborn.zip"
          $json = @(Get-Content pluginmaster.json -Raw -Encoding UTF8 | ConvertFrom-Json)
          $json[0].AssemblyVersion     = $ver
          $json[0].LastUpdated         = $ts
          $json[0].DownloadLinkInstall = $dl
          $json[0].DownloadLinkTesting = $dl
          $json[0].DownloadLinkUpdate  = $dl
          # UTF-8 without BOM: the file carries Chinese metadata and Dalamud parses it strictly
          $out = $json | ConvertTo-Json -Depth 10 -AsArray
          [System.IO.File]::WriteAllText((Join-Path $PWD "pluginmaster.json"), $out, (New-Object System.Text.UTF8Encoding($false)))

          git config user.name  "David"
          git config user.email "MageritX@users.noreply.github.com"
          # This workflow runs on tags, so actions/checkout leaves a DETACHED HEAD;
          # attach a local main at that commit before committing/pushing.
          git checkout -B main
          git add pluginmaster.json
          git diff --cached --quiet || git commit -m "chore: update pluginmaster v$ver [skip ci]"

          # Rebase onto latest remote before pushing; two CI runs can race on main.
          # On conflict (pluginmaster.json timestamp churn) prefer our freshly written version.
          git pull --rebase origin main -X theirs 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) {
            git rebase --abort
            Write-Host "rebase failed; retrying with merge"
            git pull origin main --no-edit 2>&1 | Out-Host
          }
          git push origin main

      - name: Purge jsDelivr cache (CN users)
        shell: pwsh
        run: |
          # jsDelivr caches GitHub files; purge so 卫月/Dalamud fetches the fresh pluginmaster
          try { Invoke-WebRequest "https://purge.jsdelivr.net/gh/MageritX/GatherBuddyReborn@main/pluginmaster.json" -UseBasicParsing | Out-Null; Write-Host "jsDelivr cache purged" }
          catch { Write-Host "jsDelivr purge failed (non-fatal): $_" }
