name: Pull Request Test Build
on:
  pull_request:
    branches:
      - main
jobs:
  Build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud (global + CN dev assemblies)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

          # The CN fork's GatherBuddy.GameData / GatherBuddy.DataImport / GatherBuddy.Levenshtein
          # projects use Dalamud.CN.NET.Sdk, which resolves the Dalamud installation from
          # %APPDATA%\XIVLauncherCN\addon\Hooks\dev. The official goatcorp Dalamud does NOT contain
          # ClientLanguage.ChineseSimplified, so the CN dev assemblies are required as well.
          # Pinned snapshot (source: XIVLauncherCN's Dalamud dev folder):
          # https://github.com/MageritX/GatherBuddyReborn/releases/tag/cn-dalamud-dev-15-0-3-4
          Invoke-WebRequest -Uri https://github.com/MageritX/GatherBuddyReborn/releases/download/cn-dalamud-dev-15-0-3-4/cn-dalamud-dev.zip -OutFile cn-dalamud.zip
          Expand-Archive -Force cn-dalamud.zip "$env:AppData\XIVLauncherCN\addon\Hooks\dev"

      - name: Restore Nuget Packages
        run: dotnet restore Gatherbuddy/Gatherbuddy.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release Gatherbuddy/Gatherbuddy.csproj --output .\build
      - name: Build raphael-cli from raphael-rs
        run: |
          git clone https://github.com/KonaeAkira/raphael-rs.git raphael-rs-temp
          cd raphael-rs-temp
          cargo build --release --package raphael-cli
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: Failed to build raphael-cli"
            exit 1
          }
          Copy-Item -Path ".\target\release\raphael-cli.exe" -Destination "..\build\raphael-cli.exe" -Force
          cd ..
          Remove-Item -Recurse -Force raphael-rs-temp
          Write-Host "Successfully built and copied raphael-cli.exe"
